[package]
name = "rust-wasm-simd-vector-search"
version = "1.0.0"
edition = "2021"
authors = ["Felipe Madison <160553421+FelipeMadson@users.noreply.github.com>"]
description = "Ultra-fast, zero-cloud client-side vector similarity search engine in Rust with WebAssembly SIMD acceleration and HNSW indexing."
license = "MIT"
repository = "https://github.com/FelipeMadson/rust-wasm-simd-vector-search"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.99"
serde = { version = "1.0.210", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
rand = "0.8.5"

[dev-dependencies]
wasm-bindgen-test = "0.3.49"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
